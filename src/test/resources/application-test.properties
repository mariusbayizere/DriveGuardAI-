# =============================================================================
#  TEST PROFILE  —  src/test/resources/application-test.properties
#  Overrides application.properties + application-local.properties for tests.
#  Uses H2 in-memory DB so tests never touch your real PostgreSQL database.
#
#  NOTE: JWT secret is hardcoded in JwtConstant.java — no property needed here.
# =============================================================================

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ─── Database: H2 in-memory (replaces PostgreSQL) ────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# Disable batching — can cause issues with H2
spring.jpa.properties.hibernate.jdbc.batch_size=0
spring.jpa.properties.hibernate.order_inserts=false
spring.jpa.properties.hibernate.order_updates=false
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=false

# ─── Connection Pool: minimal for tests ──────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# ─── Google OAuth2: dummy values so Spring context loads without real creds ───
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=email,profile,openid

# ─── Mail: stub config — no real SMTP calls during tests ─────────────────────
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Manager email property used by notification services
app.manager.email=test@test.com

# ─── Logging: quiet during tests ─────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.example.DriveGuardAI=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN
logging.level.org.springframework.security=WARN

# ─── Error details ───────────────────────────────────────────────────────────
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-exception=true
