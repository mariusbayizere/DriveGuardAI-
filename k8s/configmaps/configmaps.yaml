# ─── Spring Boot ConfigMap ────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: springboot-config
  namespace: prod
  labels:
    app: driveguard-springboot
    project: driveguard
data:
  SPRING_PROFILE: "prod"
  SERVER_PORT: "8080"
  DB_URL: "jdbc:postgresql://postgres-service:5432/driveguard_ai"
  OAUTH_REDIRECT_URI: "http://driveguard.local/login/oauth2/code/google"
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: springboot-config
  namespace: dev
  labels:
    app: driveguard-springboot
    project: driveguard
data:
  SPRING_PROFILE: "dev"
  SERVER_PORT: "8080"
  DB_URL: "jdbc:postgresql://postgres-service:5432/driveguard_ai_dev"
  OAUTH_REDIRECT_URI: "http://localhost/login/oauth2/code/google"
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
---
# ─── Flask ConfigMap ──────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-config
  namespace: prod
  labels:
    app: driveguard-flask
    project: driveguard
data:
  JAVA_BACKEND_URL: "http://springboot-service:8080"
  SCREENSHOTS_DIR: "/app/violations_screenshots"
  DRIVER_FACES_DIR: "/app/driver_faces"
  YOLO_WEIGHTS: "/app/yolo/yolov3.weights"
  YOLO_CFG: "/app/yolo/yolov3.cfg"
  YOLO_NAMES: "/app/yolo/coco.names"
  VIOLATION_COOLDOWN: "10"
  AT_USERNAME: "sandbox"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-config
  namespace: dev
  labels:
    app: driveguard-flask
    project: driveguard
data:
  JAVA_BACKEND_URL: "http://springboot-service:8080"
  SCREENSHOTS_DIR: "/app/violations_screenshots"
  DRIVER_FACES_DIR: "/app/driver_faces"
  YOLO_WEIGHTS: "/app/yolo/yolov3.weights"
  YOLO_CFG: "/app/yolo/yolov3.cfg"
  YOLO_NAMES: "/app/yolo/coco.names"
  VIOLATION_COOLDOWN: "10"
  AT_USERNAME: "sandbox"
---
# ─── React ConfigMap ──────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: react-config
  namespace: prod
  labels:
    app: driveguard-react
    project: driveguard
data:
  REACT_APP_API_BASE: "http://driveguard.local/api/v1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: react-config
  namespace: dev
  labels:
    app: driveguard-react
    project: driveguard
data:
  REACT_APP_API_BASE: "http://localhost/api/v1"
